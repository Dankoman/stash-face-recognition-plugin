name: Face Recognition Plugin
description: Face recognition plugin that can pause scenes, capture frames, display named bounding boxes and add identified performers to a scene
version: 3.0.3
url: https://github.com/Dankoman/stash-face-recognition-plugin

ui:
  javascript:
    - standalone-browser.js
    - face-recognition.js
  css:
    - face-recognition.css
  assets:
    /face: assets
  csp:
    script-src:
      - "'self'"
      - "'wasm-unsafe-eval'"
    style-src:
      - "'self'"
      - "'unsafe-inline'"
    connect-src:
      - "'self'"
      - "https:"
      - "http:"


settings:
  compute_backend:
    displayName: Analysis engine
    description: auto uses WebGPU when available; cpu uses WebAssembly.
    type: STRING
  api_timeout:
    displayName: Analysis timeout (seconds)
    description: Maximum time including model loading (30–600 seconds). Default 180.
    type: NUMBER
  show_confidence:
    displayName: Show confidence
    description: Show confidence as a percentage for identified faces
    type: BOOLEAN
  min_confidence:
    displayName: Minimum confidence
    description: Suggestions below the threshold (0-100) are marked as uncertain and remain visible.
    type: NUMBER
  auto_add_performers:
    displayName: Automatically add performers
    description: Automatically add identified performers to the scene
    type: BOOLEAN
  create_new_performers:
    displayName: Create new performers
    description: Create new performer records for unknown faces
    type: BOOLEAN
  max_suggestions:
    displayName: Max suggestions (top-K)
    description: Number of candidates with individual previews per face (1-10).
    type: NUMBER
  image_source:
    displayName: Image source
    description: Source for preview images (local, stashdb, or both)
    type: STRING
  stashdb_endpoint:
    displayName: StashDB endpoint
    description: StashDB GraphQL endpoint URL (e.g. https://stashdb.org/graphql)
    type: STRING
  metadata_source:
    displayName: Metadata source
    description: all searches StashDB, TPDB, PMVStash and FansDB in that order and uses the first unambiguous match. Otherwise select stashdb, tpdb, pmvstash or fansdb as the primary source.
    type: STRING
